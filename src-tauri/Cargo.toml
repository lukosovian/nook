[package]
name = "nook"
version = "0.2.51"
description = "Nook — yaşayan bir Dynamic Island"
edition = "2021"

[lib]
name = "nook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
wmi = "0.18.4"
tauri-plugin-single-instance = "2"
# Windows bildirim veritabanını (wpndatabase.db) salt okunur okumak için
rusqlite = { version = "0.32", features = ["bundled"] }
# Uygulama ikonları (PNG) ve "Ekrana sor" görüntüsü (JPEG)
png = "0.17"
jpeg-encoder = "0.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "time"] }
unrar = "0.5"
rustfft = "6"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# IPolicyConfig (ses çıkışını değiştirme) için #[interface] makrosu — windows 0.62 ile aynı sürüm
windows-core = "0.62"
# WebView2 denetleyicisi: arka planı şeffaf tut (Tauri ile aynı sürüm)
webview2-com = "0.39"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_System_Shutdown",
  "Win32_Media_Audio",
  "Win32_Devices_Bluetooth",
  "Win32_Devices_Display",
  # Pano: dosya listesi (CF_HDROP) yazma
  "Win32_System_Memory",
  # Oturum kilitli mi
  "Win32_System_RemoteDesktop",
  # GPU kullanımı (performans sayaçları)
  "Win32_System_Performance",
  # USB diski güvenle çıkarma
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Security",
  # Claude Code köprüsü: named pipe
  "Win32_System_Pipes",
] }
# "Şu an çalan" (GSMTC) — Tauri zaten bu sürümü derliyor
windows = { version = "0.62", features = [
  "Media_Control",
  "Storage_Streams",
  "Foundation",
  # Ses seviyesi, anlık ses şiddeti, çıkış cihazı
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Properties",
  # Hızlı ayarlar: Wi-Fi / Bluetooth radyoları
  "Devices_Radios",
  "Foundation_Collections",
  # Uygulama ikonları/adları (IShellItemImageFactory), ekran yakalama
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  # İnternet bağlantısı durumu
  "Networking_Connectivity",
  # Uygulama başına ses çıkışı (AudioPolicyConfig), Gezgin'de seçili dosyalar
  "Win32_System_WinRT",
  "Win32_System_Ole",
  # Parolayı unutunca Windows Hello (PIN, parmak izi, yüz) ile doğrulama
  "Security_Credentials_UI",
] }
# WinRT IAsyncOperation türü (Windows Hello doğrulamasını pencereye bağlarken adı gerekiyor)
windows-future = "0.3"

# Küçük, hızlı release binary'si
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
