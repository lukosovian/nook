[package]
name = "nook-mobile"
version = "0.3.3"
description = "Nook Mobil — telefondan PC'deki Nook"
edition = "2021"

[lib]
name = "nook_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pano: PC'nin geçmişinden telefona kopyala, telefondakini PC'ye gönder
tauri-plugin-clipboard-manager = "2"
# Play Store'u açmak (Tailscale kurulumu)
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
